# Eki AI Automation Control Center — local development stack.
#
# Brings up: the standalone Postgres + Redis for this project, a real n8n
# instance (so "Deploy n8n" can be exercised locally before Railway), the
# API, the video worker, and the web UI. Every port is offset from common
# defaults (5433, 6380, 5679, ...) so this never collides with anything else
# already running on the machine (including ekiapp-backend-main's own
# Postgres, if that happens to be running locally too).
#
# Usage:
#   cd docker && docker compose up -d --build
#   Web UI:  http://localhost:3200
#   API:     http://localhost:4100
#   n8n:     http://localhost:5679

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: automation
      POSTGRES_DB: eki_automation
    ports:
      - "5433:5432"
    volumes:
      - automation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - automation_redis_data:/data

  n8n:
    image: n8nio/n8n:1.62.1
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5679/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY, e.g. openssl rand -hex 32}
      N8N_API_KEY_ENABLED: "true"
      GENERIC_TIMEZONE: Africa/Lagos
    volumes:
      - automation_n8n_data:/home/node/.n8n

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4100:4100"
    environment:
      NODE_ENV: production
      PORT: "4100"
      DATABASE_URL: postgresql://automation:automation@postgres:5432/eki_automation
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3200
      AUTOMATION_SECRET_KEY: ${AUTOMATION_SECRET_KEY:?set AUTOMATION_SECRET_KEY, e.g. openssl rand -hex 32}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. openssl rand -hex 32}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://automation:automation@postgres:5432/eki_automation
      REDIS_URL: redis://redis:6379
      AUTOMATION_SECRET_KEY: ${AUTOMATION_SECRET_KEY:?set AUTOMATION_SECRET_KEY}
      VIDEO_WORKER_CONCURRENCY: "1"
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - automation_video_storage:/data/storage

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_AUTOMATION_API_URL: http://localhost:4100
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3200:3200"

volumes:
  automation_postgres_data:
  automation_redis_data:
  automation_n8n_data:
  automation_video_storage:
