# Render Blueprint: API (Docker, docker/Dockerfile.api) + managed Postgres.
# Import this repo in Render (New > Blueprint). Set the sync:false values in the dashboard.
services:
  - type: web
    name: eki-automation-api
    runtime: docker
    repo: https://github.com/chialimouadabderrahmene/aiautonation-n8n
    branch: claude/vercel-services-deploy
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eki-automation-db
          property: connectionString
      - key: AUTOMATION_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false

databases:
  - name: eki-automation-db
    databaseName: eki_automation
    plan: basic-256mb
